name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # release-please owns tag + GitHub Release creation (no
  # skip-github-release). Because it tags every release inside its own run
  # — before it computes the next release PR — it always knows the previous
  # release boundary, so it never regenerates the changelog from the start
  # of history or proposes a spurious major bump. This job is kept minimal
  # so nothing downstream (changelog enrichment, release notes) can fail it.
  #
  # Do not force a version with an empty `Release-As:` commit in this repo.
  # release-please hands an empty commit to every provider package and,
  # because of exclude-paths, not to the SDK. Set "release-as" on that one
  # package's entry in release-please-config.json instead, and remove it once
  # the release is out.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Every release PR this run created or updated, as a JSON array. Release
      # PRs are separate per package, so there can be one for the SDK and one
      # for each provider.
      prs: ${{ steps.release.outputs.prs }}
      # With more than one package, these two refer to the root package (the SDK) only.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Three per provider package, keyed by its path in release-please-config.json.
      github_actions_release_created: ${{ steps.release.outputs['packages/workload-identity-github-actions--release_created'] }}
      github_actions_version: ${{ steps.release.outputs['packages/workload-identity-github-actions--version'] }}
      github_actions_tag_name: ${{ steps.release.outputs['packages/workload-identity-github-actions--tag_name'] }}
      gcp_release_created: ${{ steps.release.outputs['packages/workload-identity-gcp--release_created'] }}
      gcp_version: ${{ steps.release.outputs['packages/workload-identity-gcp--version'] }}
      gcp_tag_name: ${{ steps.release.outputs['packages/workload-identity-gcp--tag_name'] }}
      aws_release_created: ${{ steps.release.outputs['packages/workload-identity-aws--release_created'] }}
      aws_version: ${{ steps.release.outputs['packages/workload-identity-aws--version'] }}
      aws_tag_name: ${{ steps.release.outputs['packages/workload-identity-aws--tag_name'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # While the SDK's release PR is open, enrich it before it merges. Runs as
  # its own job (gated on a release PR existing) so a failure here can never
  # block the release or any publish that depends on release-please.
  enrich-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs
    runs-on: ubuntu-latest
    steps:
      # `prs` can hold a provider's release PR as well, and release-please's
      # own `pr` output is whichever it lists first. Only the SDK's release PR
      # has fragments to inline. Its title is the only one with no package
      # name before the version ("chore(main): release 9.7.0", against
      # "build(main): release workos-php-workload-identity-gcp 0.1.0"),
      # because the root package sets include-component-in-tag to false.
      #
      # The provider titles start with "build" on purpose
      # (pull-request-title-pattern in release-please-config.json). A
      # provider's release commit edits the root manifest, so the SDK sees it,
      # and the php release type lists "chore" commits in the changelog but
      # hides "build": a "chore" title would open an SDK release PR for every
      # provider release. Each package also logs "Bad pull request title" for
      # the other packages' merged release PRs; that is expected.
      - name: Find the SDK release PR
        id: sdk-pr
        env:
          PRS_JSON: ${{ needs.release-please.outputs.prs }}
        run: |
          set -euo pipefail
          pr="$(jq -c '[.[] | select((.title // "") | test("release v?[0-9]+\\.[0-9]+\\.[0-9]+"))][0] // empty' <<<"$PRS_JSON")"
          if [ -z "$pr" ]; then
            echo "No SDK release PR is open; nothing to enrich."
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.sdk-pr.outputs.pr != ''
        id: app-token
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout release PR branch
        if: steps.sdk-pr.outputs.pr != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ fromJSON(steps.sdk-pr.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      # Inline pending changelog fragments under the version heading
      # release-please just wrote in CHANGELOG.md. For PRs that have a
      # fragment (the autogen flow always writes one), drop the line
      # release-please rendered and use the fragment instead. For PRs
      # without a fragment (typical for human-authored PRs), keep what
      # release-please wrote. Fragments are deleted in the same commit.
      # Idempotent: if no fragments exist, skip silently.
      - name: Inline rich changelog fragments
        if: steps.sdk-pr.outputs.pr != ''
        env:
          PR_JSON: ${{ steps.sdk-pr.outputs.pr }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(.changelog-pending/*.md)
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "No .changelog-pending fragments; leaving release-please CHANGELOG.md as-is."
            exit 0
          fi

          VERSION=$(echo "$PR_JSON" | jq -r '.title' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          export VERSION

          python3 - <<'PY'
          import os, re, pathlib, glob

          version = os.environ["VERSION"]

          # Load fragments + extract the PR number each one covers from
          # its top-line "* [#NN](url) ...".
          fragments = []
          covered = set()
          for path in sorted(glob.glob(".changelog-pending/*.md")):
              body = pathlib.Path(path).read_text().rstrip()
              m = re.search(r'\[#(\d+)\]', body)
              if m:
                  covered.add(m.group(1))
              fragments.append(body)

          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text()
          section_re = re.compile(
              r'(^## \[' + re.escape(version) + r'\][^\n]*\n)(.*?)(?=^## |\Z)',
              re.MULTILINE | re.DOTALL,
          )
          match = section_re.search(text)
          if not match:
              raise SystemExit(f"Could not find '## [{version}]' heading in CHANGELOG.md")
          heading, body = match.group(1), match.group(2)

          # Drop any release-please line that references a PR we have a
          # fragment for.
          kept = []
          for line in body.split("\n"):
              if any(pr in covered for pr in re.findall(r'\[#(\d+)\]', line)):
                  continue
              kept.append(line)
          filtered = "\n".join(kept)

          # Collapse "### Heading\n(blank lines)\n" with nothing under
          # it. Run repeatedly until stable in case of stacked empties.
          empty_section = re.compile(
              r'^### [^\n]*\n(?:\s*\n)*(?=^### |\Z)',
              re.MULTILINE,
          )
          while True:
              new = empty_section.sub('', filtered)
              if new == filtered:
                  break
              filtered = new
          filtered = filtered.strip()

          parts = []
          if filtered:
              parts.append(filtered)
          parts.extend(fragments)
          new_body = "\n\n".join(parts)

          new_text = text[:match.start()] + heading + "\n" + new_body + "\n\n" + text[match.end():]
          changelog.write_text(new_text)
          PY

          git config user.name "workos-sdk-automation[bot]"
          git config user.email "255426317+workos-sdk-automation[bot]@users.noreply.github.com"
          git rm .changelog-pending/*.md
          git add CHANGELOG.md
          git commit -m "chore: inline release notes from .changelog-pending"
          git push

  # After release-please tags the release and creates the GitHub Release,
  # replace its body with the rich section from CHANGELOG.md (release-please
  # writes only its terse default rendering). Cosmetic-only: never fails the
  # release if the section can't be found.
  update-release-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set rich release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { found=1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            echo "No CHANGELOG.md body for $TAG; keeping release-please default notes."
          fi

  # The provider packages in packages/. Each is published by copying its
  # directory to its own read-only repository, which Packagist reads; see
  # split-package.yml. The providers require the SDK, but nothing installs it
  # here and the SDK has no publish job to wait for: Packagist reads the SDK's
  # tag, which the release-please job has already pushed.
  publish-workload-identity-github-actions:
    needs: release-please
    if: needs.release-please.outputs.github_actions_release_created == 'true'
    uses: ./.github/workflows/split-package.yml
    with:
      package-path: packages/workload-identity-github-actions
      repository: workos-php-workload-identity-github-actions
      version: ${{ needs.release-please.outputs.github_actions_version }}
      ref: ${{ needs.release-please.outputs.github_actions_tag_name }}
    secrets:
      SDK_BOT_PRIVATE_KEY: ${{ secrets.SDK_BOT_PRIVATE_KEY }}

  publish-workload-identity-gcp:
    needs: release-please
    if: needs.release-please.outputs.gcp_release_created == 'true'
    uses: ./.github/workflows/split-package.yml
    with:
      package-path: packages/workload-identity-gcp
      repository: workos-php-workload-identity-gcp
      version: ${{ needs.release-please.outputs.gcp_version }}
      ref: ${{ needs.release-please.outputs.gcp_tag_name }}
    secrets:
      SDK_BOT_PRIVATE_KEY: ${{ secrets.SDK_BOT_PRIVATE_KEY }}

  publish-workload-identity-aws:
    needs: release-please
    if: needs.release-please.outputs.aws_release_created == 'true'
    uses: ./.github/workflows/split-package.yml
    with:
      package-path: packages/workload-identity-aws
      repository: workos-php-workload-identity-aws
      version: ${{ needs.release-please.outputs.aws_version }}
      ref: ${{ needs.release-please.outputs.aws_tag_name }}
    secrets:
      SDK_BOT_PRIVATE_KEY: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
